# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
    minInstances: 0
    maxInstances: 1

# The Firebase web config is a public client identifier, so it is safe to inline here.
# App Hosting does NOT read .env.local, so client (NEXT_PUBLIC_*) vars must be declared
# for the build. Real secrets (e.g. GEMINI_API_KEY, Meta/TikTok app secrets) should be
# stored in Secret Manager and referenced with `secret:` instead of `value:`.
env:
    - variable: NEXT_PUBLIC_FIREBASE_API_KEY
      value: AIzaSyCq3VxBSv-SAu2PT0MNIAUfkuckw9PhKh4
      availability:
          - BUILD
          - RUNTIME
    - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
      value: adlens-ca57f.firebaseapp.com
      availability:
          - BUILD
          - RUNTIME
    - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
      value: adlens-ca57f
      availability:
          - BUILD
          - RUNTIME
    - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
      value: adlens-ca57f.firebasestorage.app
      availability:
          - BUILD
          - RUNTIME
    - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
      value: '629217115736'
      availability:
          - BUILD
          - RUNTIME
    - variable: NEXT_PUBLIC_FIREBASE_APP_ID
      value: '1:629217115736:web:c931ba9c249f4a2e06542d'
      availability:
          - BUILD
          - RUNTIME
    - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
      value: G-L6HN7W7VS9
      availability:
          - BUILD
          - RUNTIME
